[package]
name                   = "yazi-tty"
description            = "Yazi TTY access layer"
version                = "26.9.1"
edition = "2024"
license = "MIT"
authors = ["sxyazi <sxyazi@gmail.com>"]
homepage = "https://yazi-rs.github.io"
repository = "https://github.com/sxyazi/yazi"
rust-version = "1.98.0"


[dependencies]
yazi-ffi   = { git = "https://github.com/sxyazi/yazi", rev = "9203fd2604f867ab5ec18f24203b918975c4c00a" }
yazi-macro = { git = "https://github.com/sxyazi/yazi", rev = "9203fd2604f867ab5ec18f24203b918975c4c00a" }
yazi-shim  = { git = "https://github.com/sxyazi/yazi", rev = "9203fd2604f867ab5ec18f24203b918975c4c00a" }

# External dependencies
base64 = "0.23.1"
bitflags = { version = "2.13.2", features = [ "serde" ] }
mlua = { version = "0.12.1", features = [ "anyhow", "async", "error-send", "lua55", "macros", "serde" ] }
parking_lot = "0.12.5"
ratatui-core = { version = "0.1.2", default-features = false, features = [ "std", "layout-cache", "serde", "underline-color" ] }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.4", default-features = false, features = [ "std", "fs", "mm", "shm", "stdio", "termios", "event", "process", "system" ] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [ "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Console", "Win32_System_Threading", "Win32_Security" ] }
